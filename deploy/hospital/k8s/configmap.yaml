apiVersion: v1
kind: ConfigMap
metadata:
  name: hospital-openmetadata-config
  namespace: datahub-open-test
  labels:
    app.kubernetes.io/part-of: hospital-metadata
data:
  INTEGRATE_SSO_ENABLED: "true"
  INTEGRATE_SSO_ISSUER: https://integrate-dev.qcrmyy.local
  INTEGRATE_SSO_BACKCHANNEL_ORIGIN: http://platform.coop-dev.svc.cluster.local:8081
  INTEGRATE_SSO_TARGET_ORIGIN: http://172.16.120.211:30925
  INTEGRATE_SSO_CLIENT_ID: hospital-controlplane
  INTEGRATE_SSO_PORTAL_PATH: /s/portal
  INTEGRATE_SSO_EMAIL_DOMAIN: integrate.invalid
  # This is the existing test portal target. Use HTTPS and false together
  # when hospital IT provides a dedicated TLS entry for the metadata app.
  INTEGRATE_SSO_ALLOW_HTTP_TEST: "true"
  FORCE_SECURE_SESSION_COOKIE: "false"
  AUTHENTICATION_PROVIDER: basic
  AUTHENTICATION_CLIENT_TYPE: public
  AUTHENTICATION_ENABLE_SELF_SIGNUP: "false"
  AUTHENTICATION_ENABLE_AUTO_REDIRECT: "false"
  AUTHENTICATION_SESSION_EXPIRY: "28800"
  AUTHENTICATION_PUBLIC_KEYS: "[http://hospital-openmetadata:8585/api/v1/system/config/jwks]"
  AUTHORIZER_PRINCIPAL_DOMAIN: integrate.invalid
  DB_DRIVER_CLASS: org.postgresql.Driver
  DB_SCHEME: postgresql
  DB_HOST: hospital-metadata-postgres
  DB_PORT: "5432"
  DB_USER: openmetadata_user
  OM_DATABASE: openmetadata_db
  DB_PARAMS: "connectTimeout=10&socketTimeout=60"
  DB_CONNECTION_POOL_MAX_SIZE: "10"
  DB_CONNECTION_POOL_MIN_SIZE: "2"
  DB_CONNECTION_POOL_MIN_IDLE: "2"
  DB_CONNECTION_POOL_INITIAL_SIZE: "2"
  SEARCH_TYPE: opensearch
  ELASTICSEARCH_HOST: hospital-metadata-search
  ELASTICSEARCH_PORT: "9200"
  ELASTICSEARCH_SCHEME: http
  PIPELINE_SERVICE_CLIENT_ENABLED: "false"
  SERVER_HOST_API_URL: http://hospital-openmetadata:8585/api
  RSA_PUBLIC_KEY_FILE_PATH: /run/secrets/openmetadata-jwt/public_key.der
  RSA_PRIVATE_KEY_FILE_PATH: /run/secrets/openmetadata-jwt/private_key.der
  JWT_ISSUER: hospital-metadata-test
  JWT_KEY_ID: hospital-metadata-test
