apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: datahub-open-test
resources:
  - services.yaml
  - statefulsets.yaml
  - network-policies.yaml
configMapGenerator:
  - name: hospital-doris-config
    files:
      - fe-extra.conf
      - be-extra.conf
      - prepare.sh
      - start.sh
      - bootstrap.sh
generatorOptions:
  labels:
    app.kubernetes.io/part-of: hospital-doris
