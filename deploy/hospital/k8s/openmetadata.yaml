apiVersion: v1
kind: Service
metadata:
  name: hospital-openmetadata
  namespace: datahub-open-test
  labels:
    app.kubernetes.io/part-of: hospital-metadata
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: hospital-openmetadata
  ports:
    - name: http
      port: 8585
      targetPort: http
      nodePort: 30925
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-openmetadata
  namespace: datahub-open-test
  labels:
    app.kubernetes.io/part-of: hospital-metadata
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hospital-openmetadata
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hospital-openmetadata
        app.kubernetes.io/part-of: hospital-metadata
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-cred
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: migrate
          image: harbor.qcrmyy.local/coop/hospital-openmetadata:2.0.4-integrate-v5@sha256:aac72da620e0ab54cc428319a4bf94dec7afece72eb62bea44093e03ebc1d1c0
          command: [/bin/bash, -ec]
          args:
            - ./bootstrap/openmetadata-ops.sh migrate
          envFrom:
            - configMapRef:
                name: hospital-openmetadata-config
            - secretRef:
                name: hospital-openmetadata-runtime
          env:
            - name: INTEGRATE_SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: integrate-datahub-sso
                  key: CLIENT_SECRET
          volumeMounts:
            - name: jwt
              mountPath: /run/secrets/openmetadata-jwt
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
      containers:
        - name: openmetadata
          image: harbor.qcrmyy.local/coop/hospital-openmetadata:2.0.4-integrate-v5@sha256:aac72da620e0ab54cc428319a4bf94dec7afece72eb62bea44093e03ebc1d1c0
          ports:
            - name: http
              containerPort: 8585
          envFrom:
            - configMapRef:
                name: hospital-openmetadata-config
            - configMapRef:
                name: hospital-integration-config
            - secretRef:
                name: hospital-openmetadata-runtime
          env:
            - name: HOSPITAL_SOURCE_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hospital-integration-runtime
                  key: HOSPITAL_SOURCE_PASSWORD
            - name: HOSPITAL_TARGET_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hospital-integration-runtime
                  key: HOSPITAL_TARGET_PASSWORD
            - name: INTEGRATE_SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: integrate-datahub-sso
                  key: CLIENT_SECRET
            - name: OPENMETADATA_HEAP_OPTS
              value: -Xms1G -Xmx2G
          startupProbe:
            httpGet:
              path: /api/v1/integrate/auth/config
              port: http
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/integrate/auth/config
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: jwt
              mountPath: /run/secrets/openmetadata-jwt
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "3"
              memory: 4Gi
      volumes:
        - name: jwt
          secret:
            secretName: openmetadata-jwt
            defaultMode: 0440
