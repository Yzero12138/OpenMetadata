---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hospital-integration-databases
  labels:
    app.kubernetes.io/part-of: hospital-integration
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [hospital-integration-source, hospital-integration-ods]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hospital-seatunnel
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hospital-openmetadata
      ports:
        - protocol: TCP
          port: 5432
