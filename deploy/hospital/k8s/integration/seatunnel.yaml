apiVersion: v1
kind: ConfigMap
metadata:
  name: hospital-seatunnel-config
  labels:
    app.kubernetes.io/part-of: hospital-integration
data:
  seatunnel.yaml: |
    seatunnel:
      engine:
        classloader-cache-mode: true
        history-job-expire-minutes: 10080
        backup-count: 0
        queue-type: blockingqueue
        print-execution-info-interval: 60
        print-job-metrics-info-interval: 60
        slot-service:
          dynamic-slot: true
        checkpoint:
          interval: 10000
          timeout: 60000
          retain-after-job-cancelled: true
          storage:
            type: hdfs
            max-retained: 3
            plugin-config:
              namespace: /data/checkpoints/
              storage.type: hdfs
              fs.defaultFS: file:///
        telemetry:
          metric:
            enabled: false
          logs:
            scheduled-deletion-enable: true
        http:
          enable-http: true
          port: 8080
          enable-dynamic-port: false
          upload-max-file-size-mb: 1
          upload-max-request-size-mb: 1
  hazelcast.yaml: |
    hazelcast:
      cluster-name: hospital-synthetic-integration
      network:
        rest-api:
          enabled: false
        join:
          multicast:
            enabled: false
          tcp-ip:
            enabled: true
            member-list:
              - hospital-seatunnel-0.hospital-seatunnel-headless.datahub-open-test.svc.cluster.local:5801
        port:
          auto-increment: false
          port: 5801
      map:
        "*":
          backup-count: 0
          map-store:
            enabled: true
            initial-mode: EAGER
            factory-class-name: org.apache.seatunnel.engine.server.persistence.FileMapStoreFactory
            write-delay-seconds: 0
            properties:
              type: hdfs
              storage.type: hdfs
              namespace: /data/imap/
              clusterName: hospital-synthetic-integration
              fs.defaultFS: file:///
      properties:
        hazelcast.logging.type: log4j2
        hazelcast.operation.generic.thread.count: 8
        hazelcast.operation.thread.count: 8
        hazelcast.io.input.thread.count: 2
        hazelcast.io.output.thread.count: 2
        hazelcast.partition.count: 31
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-seatunnel-headless
  labels:
    app.kubernetes.io/part-of: hospital-integration
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: hospital-seatunnel
  ports:
    - name: cluster
      port: 5801
      targetPort: cluster
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-seatunnel
  labels:
    app.kubernetes.io/part-of: hospital-integration
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hospital-seatunnel
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hospital-seatunnel
  labels:
    app.kubernetes.io/part-of: hospital-integration
spec:
  serviceName: hospital-seatunnel-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hospital-seatunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hospital-seatunnel
        app.kubernetes.io/part-of: hospital-integration
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
        - name: harbor-cred
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seatunnel
          image: hospital-seatunnel:3.0.0-jdbc-v2
          ports:
            - name: http
              containerPort: 8080
            - name: cluster
              containerPort: 5801
          env:
            - name: JAVA_OPTS
              value: >-
                -Xms512m -Xmx1536m -XX:ActiveProcessorCount=2
                --add-opens=java.base/java.lang=ALL-UNNAMED
                --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
                --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
                --add-opens=java.base/java.io=ALL-UNNAMED
                --add-opens=java.base/java.net=ALL-UNNAMED
                --add-opens=java.base/java.nio=ALL-UNNAMED
                --add-opens=java.base/java.util=ALL-UNNAMED
                --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
                --add-exports=java.base/sun.nio.ch=ALL-UNNAMED
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /opt/seatunnel/config/seatunnel.yaml
              subPath: seatunnel.yaml
              readOnly: true
            - name: config
              mountPath: /opt/seatunnel/config/hazelcast.yaml
              subPath: hazelcast.yaml
              readOnly: true
            - name: logs
              mountPath: /opt/seatunnel/logs
            - name: temp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /overview
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /overview
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: config
          configMap:
            name: hospital-seatunnel-config
        - name: logs
          emptyDir:
            sizeLimit: 1Gi
        - name: temp
          emptyDir:
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: hospital-integration
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hospital-seatunnel-isolation
  labels:
    app.kubernetes.io/part-of: hospital-integration
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hospital-seatunnel
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hospital-openmetadata
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hospital-seatunnel
      ports:
        - protocol: TCP
          port: 5801
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [hospital-integration-source, hospital-integration-ods]
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hospital-seatunnel
      ports:
        - protocol: TCP
          port: 5801
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
